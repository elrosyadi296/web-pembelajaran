<body>
    <div class="app-container">
        <!-- Modern Card Container -->
        <div class="quiz-card">
            <!-- Form Identitas -->
            <div id="start-screen" class="screen active">
                <div class="header">
                    <h2>Latihan Soal Qur'an Hadits</h2>
                    <p>Silakan isi data diri sebelum memulai latihan.</p>
                </div>
                <form id="identity-form">
                    <div class="input-group">
                        <label for="student-name">Nama Lengkap</label>
                        <input type="text" id="student-name" placeholder="Masukkan nama Anda" required>
                    </div>
                    <div class="input-group">
                        <label for="student-class">Kelas / Rombel</label>
                        <input type="text" id="student-class" placeholder="Contoh: IX-A" required>
                    </div>
                    <button type="submit" class="btn primary-btn">Mulai Mengerjakan</button>
                </form>
            </div>

            <!-- Screen Soal -->
            <div id="quiz-screen" class="screen">
                <div class="quiz-header">
                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                    <div class="meta-info">
                        <span id="question-number">Soal 1 dari 38</span>
                        <span id="timer">⏱️ 00:00</span>
                    </div>
                </div>

                <div class="question-container">
                    <h3 id="question-text">Teks soal akan muncul di sini...</h3>
                    <div id="options-container" class="options-grid"></div>
                </div>

                <div class="quiz-footer">
                    <button id="prev-btn" class="btn secondary-btn" disabled>Kembali</button>
                    <button id="next-btn" class="btn primary-btn">Berikutnya</button>
                    <button id="submit-btn" class="btn success-btn hidden">Selesai & Kirim</button>
                </div>
            </div>

            <!-- Screen Hasil -->
            <div id="result-screen" class="screen">
                <div class="result-box">
                    <div class="icon">🎉</div>
                    <h2>Latihan Selesai!</h2>
                    <p id="result-message">Jawaban Anda sedang dikirim ke sistem...</p>
                    <div class="score-display">
                        <span>Nilai Anda</span>
                        <h1 id="score-text">0</h1>
                    </div>
                    <div class="detail-stats">
                        <div class="stat"><span>Benar</span><strong id="correct-count">0</strong></div>
                        <div class="stat"><span>Salah</span><strong id="wrong-count">0</strong></div>
                    </div>
                    <button onclick="location.reload()" class="btn primary-btn" style="margin-top: 20px;">Coba Lagi</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/questions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
